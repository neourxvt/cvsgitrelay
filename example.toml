# Import directly from remote CVS into a fresh (format 3) Git destination:
#   ./cycle.sh example.toml
#   ./cycle.sh status example.toml
#   ./cycle.sh verify example.toml
# Optional independent CVS-to-CVS mirror:
#   ./cycle.sh mirror example.toml --output ./cvsroot-rxvt-unicode
# Mirror incrementally copies all revision lines and included modules; it does not
# use destination.repo, sync.scope or source.submodules.
#
# This file documents every configurable setting. Omitted optional settings use
# the defaults shown below. Unknown keys and invalid values are rejected.
# Existing CLI options override matching settings only when explicitly passed;
# A TOML path is always required. Relative destination paths are relative to this
# TOML file, while an explicit --repo override is relative to the caller.

[source]
# Required operator-assigned stable logical source identity. Reuse for aliases
# of this source. CLI override: --source-id
source_id = "schmorp-rxvt-unicode"

# Required CVS locator. Use CVS authentication facilities for credentials;
# passwords embedded in CVSROOT are rejected. Never commit private credentials.
# CLI override: --cvsroot
cvsroot = ":pserver:anonymous@cvs.schmorp.de:/schmorpforge"

# Required CVS directory or supported composite module alias.
# CLI override: --module
module = "rxvt-unicode"

# How to handle included CVS modules such as libev and libecb:
# "exclude" (default): omit their directories AND revision histories from Git.
# "include": import their files and histories into this same Git repository,
#            at the subdirectories specified by the CVS module definitions.
# These are CVS module inclusions, not Git submodule links or separate mirrors.
# Ordinary nested source directories remain part of the main module.
# The policy is pinned at initialization. A different selection requires a new
# destination. Supported source evolution can rewrite canonical Git history.
# CLI override: --submodules
submodules = "exclude"

# Require consecutive reported revision labels when true. The default accepts
# gaps using the complete listed line and validated branch/forkpoint metadata.
# CLI override: --require-consecutive-revisions[=false]
require_consecutive_revisions = false

[destination]
# Required dedicated bare Git destination. Sync initializes it automatically.
# Use a fresh directory; nonempty unmanaged repositories are rejected.
# CLI override: --repo
repo = "./git-rxvt-unicode-v2"

[sync]
# V2 always imports the entire configured scope. Partial scopes are rejected.
# CLI override: --scope
scope = "all"

# Parallel CVS revision reads. Scheduling never affects canonical bytes.
# sync and verify ignore this for a local CVSROOT (a path, :local: or :fork:)
# and use one read per CPU core instead.
# CLI override: --connections
connections = 1

[verify]
# Fixed canonical source verification policy, applied on every sync/status/verify:
# "full" (default): re-read and compare all accepted records and content.
# "trust-append-only": may reuse fingerprinted historical content, allowing
# silent old-content mutations with unchanged metadata to escape detection.
# A change requires a fresh destination. CLI override: --mode
mode = "full"

[logging]
# "text" (default): human-readable progress and indented failure reports;
# terminal colors are used when stderr is interactive unless NO_COLOR is set.
# "json": structured records for machine collection. Diagnostics use stderr;
# operation summaries use stdout. CLI override: --log-format
format = "text"

# "debug", "info" (default), "warn", or "error".
# Debug adds command timings and individual revision publications.
# CLI override: --log-level
level = "info"

# Include the originating stack and wrapping locations in failures.
# CLI override: --error-stacks
error_stacks = true

# Minimum interval between sync progress reports. Go duration syntax, such as
# "15s" or "1m"; "0s" disables periodic progress. CLI: --progress-interval
progress_interval = "15s"

[process]
# Deadline for each CVS/Git subprocess. Must be a positive Go duration.
# CLI override: --command-timeout
command_timeout = "5m"

# Maximum retained stdout bytes per command, including rlog and file contents.
# A larger command fails visibly rather than returning truncated data.
# Default: 256 MiB. CLI override: --max-output
max_output = 268435456

[debug]
# Deliberate interruption for developer recovery checks. Empty disables it.
# Syntax: "[kill:]STAGE[:ORDINAL]", for example "projection-updated:2".
# Stages: scan-start, fetch-complete, scan-complete, blob-written, tree-written,
# commit-written, objects-written, before-journal, journal-written,
# before-publish, after-publish, projection-updated, before-journal-cleanup.
# ORDINAL defaults to 1. kill: sends SIGKILL; otherwise exit 8.
# CLI override: --failpoint
failpoint = ""

[authors]
# Optional map from CVS usernames to Git author identities ("Name <email>").
# Unmapped usernames become "<username> <<username>@cvs.invalid>". Quote
# usernames that contain dots. The map is fixed when the destination is
# initialized; a different map requires a new destination.
# root = "Root User <root@example.com>"
# "j.doe" = "Jane Doe <jane@example.com>"
# The special key "<relay>" names the identity of commits the relay makes itself,
# for which CVS has no author: trunk and branch starts and tag snapshots (author
# and committer), and the committer of every revision. The default is
# "CVSGITRELAY <relay@invalid>".
# "<relay>" = "Release Bot <bot@example.com>"

[branches]
# Optional map selecting and renaming the CVS branches published as Git
# branches. Keys are "trunk" or a raw CVS branch name (quote names with dots),
# values are Git branch names that must be distinct and valid for Git. Only the
# listed branches get a refs/heads/<name> ref and HEAD follows the trunk.
# Omit the table to publish every branch as refs/heads/cvs/b<hex name>.
# Tags are unaffected. The map is fixed when the destination is initialized;
# a different map requires a new destination.
# trunk = "main"
# "REL-9_30" = "release/9.30"

# Fixed v2 profiles: exact CVS -kb bytes, mode 100644, SHA-1 Git objects, ASCII
# provenance and manifest, complete deterministic replay, single state-ref CAS.
# Remote Git imports require only normal CVS read access, without server files.
# The complete rlog dialect, ancestry and log normalization are specified in
# doc-format-v2.md.
